<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VITALINK初回設定</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --ink:#1F3B36;
    --leaf:#2F6B5E;
    --leaf-soft:#E7F1EE;
    --mist:#F6F8F7;
    --line:#DCE6E3;
    --err:#C0533D;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--mist);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--white);
    padding:0 0 40px;
  }
  header{
    padding:36px 24px 28px;
    background:linear-gradient(160deg,var(--leaf) 0%,#3E8271 100%);
    color:var(--white);
    border-radius:0 0 28px 28px;
  }
  .mark{
    width:40px;height:40px;
    border-radius:12px;
    background:rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  .mark svg{width:22px;height:22px;}
  h1{
    font-size:22px;
    margin:0 0 8px;
    letter-spacing:0.02em;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:14px;
    line-height:1.7;
    opacity:0.92;
  }
  .privacy-note{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin:18px 24px 0;
    padding:14px 16px;
    background:var(--leaf-soft);
    border-radius:12px;
    font-size:12.5px;
    line-height:1.7;
    color:#2A4F47;
  }
  .privacy-note svg{flex-shrink:0;margin-top:1px;width:16px;height:16px;}
  form{padding:28px 24px 0;}
  .field{margin-bottom:22px;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:8px;
    color:var(--ink);
  }
  label .req{color:var(--err);margin-left:2px;}
  label .sub{
    display:block;
    font-weight:400;
    font-size:11.5px;
    color:#7A8D88;
    margin-top:2px;
  }
  input[type=text],input[type=email]{
    width:100%;
    padding:14px 14px;
    font-size:15px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--mist);
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, background .15s ease;
    font-family:inherit;
  }
  input[type=text]:focus,input[type=email]:focus{
    border-color:var(--leaf);
    background:var(--white);
  }
  select{
    width:100%;
    padding:14px 14px;
    font-size:15px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--mist) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%232F6B5E"><path d="M5.5 7.5l4.5 4.5 4.5-4.5"/></svg>') no-repeat right 14px center/16px;
    appearance:none;
    -webkit-appearance:none;
    color:var(--ink);
    font-family:inherit;
  }
  select:focus{border-color:var(--leaf);background-color:var(--white);}
  .error-msg{
    display:none;
    font-size:12px;
    color:var(--err);
    margin-top:6px;
  }
  .field.invalid input,.field.invalid select{border-color:var(--err);background:#FBF0EE;}
  .field.invalid .error-msg{display:block;}
  button{
    width:100%;
    padding:16px;
    font-size:15.5px;
    font-weight:700;
    color:var(--white);
    background:var(--leaf);
    border:none;
    border-radius:12px;
    margin-top:8px;
    cursor:pointer;
    letter-spacing:0.02em;
    transition:background .15s ease, transform .1s ease;
  }
  button:active{transform:scale(0.98);}
  button:disabled{background:#A9C2BC;}
  .footnote{
    text-align:center;
    font-size:11.5px;
    color:#9AA9A5;
    margin-top:16px;
    line-height:1.6;
  }

  /* success state */
  .success-view{
    display:none;
    padding:60px 28px 40px;
    text-align:center;
  }
  .success-icon{
    width:64px;height:64px;
    margin:0 auto 20px;
    border-radius:50%;
    background:var(--leaf-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .success-view h2{font-size:18px;margin:0 0 10px;}
  .success-view p{font-size:13.5px;color:#5C716B;line-height:1.8;margin:0;}
</style>
</head>
<body>
<div class="wrap">

  <div id="form-view">
    <header>
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
      </div>
      <h1>VITALINK 初回設定</h1>
      <p>ご利用にあたり、簡単な登録をお願いします。<br>入力は1分ほどで完了します。</p>
    </header>

    <div class="privacy-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2A4F47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5l-8-3z"/></svg>
      <span>入力内容は保健師・産業医など限られた担当者のみが確認します。所属先の上司・人事にそのまま共有されることはありません。</span>
    </div>

    <form id="vitalink-form" novalidate>

      <div class="field" data-field="email">
        <label>メールアドレス<span class="req">*</span></label>
        <input type="email" name="email" placeholder="example@company.co.jp" autocomplete="email">
        <p class="error-msg">メールアドレスを入力してください</p>
      </div>

      <div class="field" data-field="company">
        <label>会社名<span class="req">*</span></label>
        <input type="text" name="company" placeholder="株式会社〇〇">
        <p class="error-msg">会社名を入力してください</p>
      </div>

      <div class="field" data-field="fullname">
        <label>氏名（フルネーム）<span class="req">*</span>
          <span class="sub">例：佐藤太郎（サトウタロウ）</span>
        </label>
        <input type="text" name="fullname" placeholder="佐藤太郎（サトウタロウ）">
        <p class="error-msg">氏名を入力してください</p>
      </div>

      <div class="field" data-field="department">
        <label>所属部署<span class="req">*</span></label>
        <input type="text" name="department" placeholder="例：営業部">
        <p class="error-msg">所属部署を入力してください</p>
      </div>

      <div class="field" data-field="position">
        <label>役職<span class="req">*</span></label>
        <select name="position">
          <option value="" disabled selected>選択してください</option>
          <option value="一般社員">一般社員</option>
          <option value="管理職">管理職</option>
          <option value="役員">役員</option>
        </select>
        <p class="error-msg">役職を選択してください</p>
      </div>

      <div class="field" data-field="employeeId">
        <label>社員ID<span class="req">*</span></label>
        <input type="text" name="employeeId" placeholder="例：00123" inputmode="numeric">
        <p class="error-msg">社員IDを入力してください</p>
      </div>

      <button type="submit" id="submit-btn">登録する</button>
      <p class="footnote">登録後、LINEメニューからすべての機能がご利用いただけます</p>
    </form>
  </div>

  <div class="success-view" id="success-view">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2F6B5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="30" height="30"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h2>登録が完了しました</h2>
    <p>このままLINEのトーク画面に戻り、<br>メニューからご利用を始めてください。</p>
  </div>

</div>

<script>
  // ── LIFF初期化 ─────────────────────────────
  // 発行後の liff.id をここに設定してください（例: "1234567890-AbCdEfGh"）
  const LIFF_ID = "2011088730-Fa3HDSiO";
  let liffReady = false;

  if (typeof liff !== "undefined" && LIFF_ID !== "YOUR_LIFF_ID") {
    liff.init({ liffId: LIFF_ID })
      .then(() => { liffReady = true; })
      .catch((err) => console.error("LIFF init error", err));
  }

  // ── フォームのバリデーション & 送信 ─────────────────────────────
  const form = document.getElementById("vitalink-form");
  const submitBtn = document.getElementById("submit-btn");

  // 送信先: GASのWebアプリURLに差し替えてください
  const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbwSRim_GQyGes-GgpklKgmmz7mFaQD7u8UpaH3LmdeBDip6mksaTF6JWvroA3v62jt5Rw/exec";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    let valid = true;

    const fields = form.querySelectorAll(".field");
    fields.forEach(f => f.classList.remove("invalid"));

    const data = {};
    fields.forEach(f => {
      const input = f.querySelector("input,select");
      const val = input.value.trim();
      data[f.dataset.field] = val;
      if (!val) {
        f.classList.add("invalid");
        valid = false;
      }
    });

    if (!valid) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "送信中...";

    // LINE User ID を付与（LIFF内で開いている場合のみ取得可能）
    if (liffReady && liff.isLoggedIn()) {
      try {
        const profile = await liff.getProfile();
        data.lineUserId = profile.userId;
      } catch (err) {
        console.error("profile取得エラー", err);
      }
    }

    try {
      if (ENDPOINT_URL !== "YOUR_GAS_WEBAPP_URL") {
        // GAS Webアプリはpreflight(OPTIONS)に対応していないため、
        // text/plainで送りCORSのプリフライトを回避する
        await fetch(ENDPOINT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(data)
        });
      } else {
        console.log("送信データ（テスト表示）:", data);
      }

      document.getElementById("form-view").style.display = "none";
      document.getElementById("success-view").style.display = "block";

      setTimeout(() => {
        if (liffReady) liff.closeWindow();
      }, 1800);

    } catch (err) {
      console.error("送信エラー", err);
      submitBtn.disabled = false;
      submitBtn.textContent = "登録する";
      alert("送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。");
    }
  });
</script>
</body>
</html>
